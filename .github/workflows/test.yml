name: Deploy React Website to EC2
on: workflow_dispatch

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy build to EC2
        run: |
          ssh -i ~/.ssh/ec2.pem "ec2-user@$EC2_HOST" \
            'mkdir -p /home/ec2-user/ec2-react/dist'

          scp -i ~/.ssh/ec2.pem -r dist/. \
            "ec2-user@$EC2_HOST:/home/ec2-user/ec2-react/dist/"
